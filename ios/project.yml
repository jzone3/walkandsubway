name: Walkmaxxing
options:
  bundleIdPrefix: com.walkandsubway
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Walkmaxxing:
    type: application
    platform: iOS
    sources: [Walkmaxxing]
    info:
      path: Walkmaxxing/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: walkmaxxing
        NSLocationWhenInUseUsageDescription: Used to fill in your current location as a route endpoint.
  WalkmaxxingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WalkmaxxingUITests]
    dependencies:
      - target: Walkmaxxing
schemes:
  Walkmaxxing:
    build:
      targets:
        Walkmaxxing: all
        WalkmaxxingUITests: [test]
    run:
      config: Debug
    test:
      targets: [WalkmaxxingUITests]
